name: Bug report
description: Report broken behavior, regressions, or crashes.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, or crashes.
        Search existing issues first and keep the report focused on one problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I included enough detail to reproduce or investigate the problem.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of tmux-web is affected?
      options:
        - Server (src/) — sessions, WebSocket, scheduling
        - Browser client (src/browser) — terminal UI, sidebar, quick commands
        - Extensions (extensions/, packages/)
        - CLI / install (bin, postinstall, pty permissions)
        - Docs
        - Build, CI, or release tooling
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic repro.
      placeholder: |
        1. Run `tmux-web` in ...
        2. Open http://localhost:... in ...
        3. Click / type ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: The terminal reconnects and resumes the same tmux session.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The WebSocket closes and the page shows ...
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: npm version, commit SHA, or branch name if known.
      placeholder: v0.3.2 / main @ abc1234

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node/Bun, and tmux versions if relevant.
      placeholder: Linux, Chrome 135, Node 22, tmux 3.4

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste the most relevant output only. Redact secrets.
      render: shell
    validations:
      required: false

  - type: upload
    id: attachments
    attributes:
      label: Screenshots, recordings, or supporting files
      description: Redact secrets before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.log,.txt,.json,.zip"

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
    validations:
      required: false
