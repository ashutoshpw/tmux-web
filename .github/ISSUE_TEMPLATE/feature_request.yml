name: Feature request
description: Suggest an idea or improvement for tmux-web.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals concrete: the problem you are hitting and the smallest
        change that would solve it. Search existing issues first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server (src/) — sessions, WebSocket, scheduling
        - Browser client (src/browser) — terminal UI, sidebar, quick commands
        - Extensions (extensions/, packages/)
        - CLI / install
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The smallest change that would solve the problem.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including workarounds or existing tools.
    validations:
      required: false
