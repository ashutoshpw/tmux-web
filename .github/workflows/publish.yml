name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — validate the full release path without publishing"
        type: boolean
        required: false
        default: true

# Least privilege: only the publish job gets id-token (npm provenance).
permissions:
  contents: read

# Serialize publishes so overlapping tag pushes can never race to npm or
# publish out of order. Running publishes are never canceled, and queue: max
# keeps every pending run instead of the default newest-wins single slot, so
# a queued tag can never be silently dropped. Dry runs share the group on
# purpose: they must not interleave with a real publish.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # write: creates the GitHub Release on a real tag publish.
      contents: write
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@v4

      # bun is the package manager / script runner (min v1.4.2, see packageManager
      # in package.json); the server itself still runs on Node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm with trusted publishing support
        run: npm install --global "npm@^11.5.1"

      # `npm ci` is not an option here: the repo has no package-lock.json,
      # only bun.lock. npm publish still handles auth + provenance below.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # Fail on missing/empty build artifacts before anything hits npm.
      - run: bun run verify:dist

      # Refuse to publish a version that already exists on npm (re-tagging an
      # old commit would otherwise mutate a released version).
      - name: Guard against republishing an existing version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if npm view "tmux-web@$VERSION" version >/dev/null 2>&1; then
            echo "::error::tmux-web@$VERSION is already published; bump the version before tagging."
            exit 1
          fi

      # Dry runs exercise the identical pipeline (prepublishOnly included) and
      # end at `npm publish --dry-run`, which needs no auth — so the release
      # path stays continuously validated without burning a version.
      - name: Publish to npm (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance

      # Generated notes cover commits since the previous tag.
      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
